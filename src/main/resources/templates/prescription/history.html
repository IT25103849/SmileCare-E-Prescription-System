<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prescription History | SmileCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="container page-container py-5">

    <!-- HEADER -->
    <div class="action-bar mb-4">

        <div>

            <h1 class="page-title"
                th:text="${pageTitle}">

                Prescription History

            </h1>

            <div class="page-subtitle">
                View previous prescription records.
            </div>

        </div>


        <a th:if="${showBackToAll}"
           th:href="@{/prescriptions}"
           class="btn btn-light-custom">

            ← Back to All Prescriptions

        </a>

    </div>


    <div class="main-card">

        <!-- EMPTY -->
        <div class="empty-state"
             th:if="${#lists.isEmpty(prescriptions)}">

            <div class="empty-icon">
                Rx
            </div>

            <h5>
                No prescription history
            </h5>

            <p class="mb-0">
                No prescription records were found.
            </p>

        </div>


        <!-- TABLE -->
        <div class="table-container"
             th:unless="${#lists.isEmpty(prescriptions)}">

            <table class="table custom-table">

                <thead>

                <tr>

                    <th>
                        Prescription
                    </th>

                    <th>
                        Dentist
                    </th>

                    <th>
                        Visit
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Status
                    </th>

                    <th class="text-end">
                        Action
                    </th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="p : ${prescriptions}">

                    <td>

                        <strong th:text="'#' + ${p.id}">
                        </strong>

                    </td>


                    <td th:text="'Dentist ' + ${p.dentistId}">
                    </td>


                    <td th:text="${p.visitId != null
                    ? 'Visit ' + p.visitId
                    : '-'}">
                    </td>


                    <td th:text="${#temporals.format(
                    p.prescriptionDate,
                    'dd MMM yyyy, hh:mm a'
                    )}">
                    </td>


                    <td>

                        <span th:if="${p.status == 'DRAFT'}"
                              class="status-badge status-draft">

                            DRAFT

                        </span>


                        <span th:if="${p.status == 'ISSUED'}"
                              class="status-badge status-issued">

                            ISSUED

                        </span>


                        <span th:if="${p.status == 'CANCELLED'}"
                              class="status-badge status-cancelled">

                            CANCELLED

                        </span>

                    </td>


                    <td class="text-end">

                        <a th:href="@{/prescriptions/{id}(id=${p.id})}"
                           class="btn btn-sm btn-outline-primary">

                            View

                        </a>


                        <a th:if="${p.status == 'ISSUED'}"
                           th:href="@{/prescriptions/{id}/pdf(id=${p.id})}"
                           class="btn btn-sm btn-outline-success ms-1">

                            PDF

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

</body>
</html>
