<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login | SmileCare</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

  <link
          rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="login-page">


<div class="login-container">

  <div class="login-card">


    <!-- LOGO -->

    <div class="login-brand">

      <div class="brand-logo login-logo">
        SC
      </div>

      <div>

        <div class="brand-name">
          SmileCare
        </div>

        <div class="brand-module">
          E-Prescription Management
        </div>

      </div>

    </div>


    <!-- TITLE -->

    <div class="login-heading">

      <h1>
        Welcome Back
      </h1>

      <p>
        Sign in to continue to SmileCare.
      </p>

    </div>


    <!-- LOGOUT SUCCESS -->

    <div
            class="alert alert-success"
            th:if="${param.logout}">

      You have been logged out successfully.

    </div>


    <!-- LOGIN ERROR -->

    <div
            class="alert alert-danger"
            th:if="${param.error}">

      Invalid username or password.

    </div>


    <!-- LOGIN FORM -->

    <form
            th:action="@{/login}"
            method="post">


      <div class="mb-3">

        <label
                for="username"
                class="form-label">

          Username

        </label>


        <input
                id="username"
                name="username"
                type="text"
                class="form-control"
                placeholder="Enter your username"
                autocomplete="username"
                required
                autofocus>

      </div>


      <div class="mb-4">

        <label
                for="password"
                class="form-label">

          Password

        </label>


        <input
                id="password"
                name="password"
                type="password"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>

      </div>


      <button
              type="submit"
              class="btn btn-primary w-100 login-button">

        Sign In

      </button>


    </form>


    <!-- DEVELOPMENT NOTE -->

    <div class="login-footer">

            <span>
                SmileCare Dental Management System
            </span>

    </div>


  </div>

</div>


</body>

</html>
